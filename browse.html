<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Browse profiles &mdash; Iru Manam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<nav class="site-nav" id="site-nav"></nav>

<div class="container">
  <h1 class="section-heading" style="margin-top:48px;">Browse profiles</h1>
  <p class="section-sub">Live profiles from Supabase</p>

  <div class="filter-bar">
    <select id="filter-religion">
      <option value="">All religions</option>
      <option value="Hindu">Hindu</option>
      <option value="Christian">Christian</option>
      <option value="Muslim">Muslim</option>
    </select>
    <select id="filter-gender">
      <option value="">All</option>
      <option value="Female">Female</option>
      <option value="Male">Male</option>
    </select>
    <input id="filter-search" type="text" placeholder="Search by city or profession">
  </div>

  <div class="profile-grid" id="profile-grid"></div>
</div>

<footer class="site-footer" id="site-footer"></footer>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/config.js"></script>
<script src="/app.js"></script>
</body>
</html>
